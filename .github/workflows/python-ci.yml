
name: Python CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, docker]

    container:
      image: python:3.13

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ruff
            command: uv run --no-sync ruff check .

          - name: Ruff Format
            command: uv run --no-sync ruff format --check .

          - name: Ty
            command: uvx ty check .

          - name: Pytest
            command: uv run --no-sync pytest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v9
        with:
          working-directory: backend

      - name: Abhaengigkeiten installieren
        run: uv sync --locked --group dev

      - name: ${{ matrix.name }} ausfuehren
        run: ${{ matrix.command }}
