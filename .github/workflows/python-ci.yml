
name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: ${{ matrix.name }}

    runs-on: [self-hosted, linux, x64, docker]

    container:
      image: python:3.13

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ruff
            command: ruff check .

          - name: Ruff Format
            command: ruff format --check .

          - name: Ty
            command: ty check .

          - name: Pytest
            command: pytest -q

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run ${{ matrix.name }}
        run: uv run --no-sync ${{ matrix.command }}
